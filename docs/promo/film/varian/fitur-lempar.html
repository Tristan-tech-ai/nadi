<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>Nadi fitur-lempar</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
@font-face { font-family: Jakarta; src: url(../assets/fonts/jakarta.woff2) format("woff2"); font-weight: 200 800; }
@font-face { font-family: Bricolage; src: url(../assets/fonts/bricolage.woff2) format("woff2"); font-weight: 200 800; }
@font-face { font-family: PlexMono; src: url(../assets/fonts/plexmono.woff2) format("woff2"); font-weight: 500; }
:root { --kertas: #F6F2EA; --kertas-2: #EFE9DD; --tinta: #1C1B18; --tinta-2: #5B574F; --garis: #DDD5C6; --kunyit: #E9A825; --cap: #B4372A; --daun: #23704A; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { margin: 0; overflow: hidden; background: var(--kertas); }
#root { position: relative; overflow: hidden; font-family: Jakarta, sans-serif; color: var(--tinta); }
.latar { position: absolute; inset: 0; background: var(--kertas); }
.clip { position: absolute; inset: 0; }
.isi { position: absolute; }
.judul { font-family: Bricolage, sans-serif; font-weight: 800; letter-spacing: -0.025em; line-height: 1.04; }
.sorot { background: var(--kunyit); padding: 0 0.12em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.teks { font-weight: 500; line-height: 1.32; color: var(--tinta-2); }
.kartu { position: absolute; border-radius: 10px; overflow: hidden; background: var(--kertas); border: 2px solid var(--garis); box-shadow: 0 2px 0 var(--garis); }
.kartu img { display: block; width: 100%; height: auto; }
.tutup { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: var(--kertas); }
.cap { position: absolute; border: 6px solid var(--cap); color: var(--cap); font-weight: 800; letter-spacing: 0.08em; border-radius: 10px; padding: 0.1em 0.4em; transform: rotate(-7deg); background: rgba(246,242,234,0.9); }
.cap-daun { border-color: var(--daun); color: var(--daun); }
.kertas-lepas { position: absolute; background: #FBF8F2; border: 2px solid var(--garis); border-radius: 6px; padding: 22px 26px; font-family: PlexMono, monospace; font-weight: 500; color: var(--tinta); line-height: 1.5; box-shadow: 0 3px 0 var(--garis); }
.kertas-lepas b { display: block; font-family: Jakarta, sans-serif; font-weight: 800; margin-bottom: 8px; }
.logo { display: block; }
.alamat { font-family: PlexMono, monospace; font-weight: 500; color: var(--tinta); border-bottom: 6px solid var(--kunyit); display: inline-block; }

html, body { width: 1080px; height: 1920px; }
#root { width: 1080px; height: 1920px; }
</style>
</head>
<body>
<div id="root" data-composition-id="fitur-lempar" data-start="0" data-width="1080" data-height="1920" data-duration="22" data-fps="30">
<div class="latar"></div>
<section id="adegan1" class="clip" data-start="0" data-duration="3" data-track-index="1"><div id="p1" class="isi" style="left:70px; right:70px; top:640px"><div class="judul" style="font-size:112px">Foto nota, <span class="sorot">bukan ketik ulang.</span></div></div></section>
<section id="adegan2" class="clip" data-start="3" data-duration="5" data-track-index="1"><div id="l2-c" class="kartu" style="left:90px; top:560px; width:900px; height:1200px;"><img id="l2-g" src="../assets/layar-hp/lempar.png" alt="" /></div><div id="l2-t" class="isi" style="left:70px; top:170px; width:940px"><div class="judul" style="font-size:88px">Lempar Saja.</div><div class="teks" style="font-size:42px; margin-top:26px">Nota, slip gaji, KTP, CV, Excel, mutasi bank.</div></div></section>
<section id="adegan3" class="clip" data-start="8" data-duration="10" data-track-index="1"><div id="l3-c" class="kartu" style="left:60px; top:560px; width:960px; "><img id="l3-g" src="../assets/potong/nota.png" alt="" /><div id="l3-tutup" class="tutup"></div></div><div id="l3-c2" class="kartu" style="left:60px; top:1380px; width:960px"><img src="../assets/potong/kartu.png" alt="" /></div><div id="l3-t" class="isi" style="left:70px; top:170px; width:940px"><div class="judul" style="font-size:88px">Nadi membaca isinya.</div><div class="teks" style="font-size:42px; margin-top:26px">Jumlah per baris dicocokkan dengan total.</div></div></section>
<section id="adegan4" class="clip" data-start="18" data-duration="4" data-track-index="1"><div id="a4-t" class="isi" style="left:90px; top:760px; width:900px"><div style="display:flex; align-items:center; gap:28px"><svg class="logo" viewBox="0 0 64 64" width="150" height="150" aria-hidden="true"><path d="M10 54V22c0-8 6-13 14-13h8c8 0 14 5 14 13v32l-4-3-4 3-4-3-4 3V24c0-3-2-5-5-5h-2c-3 0-5 2-5 5v30l-4-3z" fill="#1C1B18"/><circle cx="52" cy="10" r="5.5" fill="#E9A825"/></svg><span class="judul" style="font-size:150px">nadi</span></div><div class="judul" style="font-size:84px; margin-top:60px">Coba usaha contohnya. <span class="sorot">Tanpa daftar.</span></div><div class="alamat" style="font-size:52px; margin-top:56px">nadi-swart.vercel.app/demo</div></div></section>
</div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
tl.to("#adegan1 .isi, #adegan1 .kartu, #adegan1 .kertas-lepas", {opacity: 0, duration: 0.3, ease: "power2.in"}, 2.68);
tl.fromTo("#p1", {opacity: 0, y: 40}, {opacity: 1, y: 0, duration: 0.5, ease: "power3.out"}, 0.15);
tl.to("#adegan2 .isi, #adegan2 .kartu, #adegan2 .kertas-lepas", {opacity: 0, duration: 0.3, ease: "power2.in"}, 7.68);
tl.fromTo("#l2-t", {opacity: 0, y: 40}, {opacity: 1, y: 0, duration: 0.5, ease: "power3.out"}, 3.1);
tl.fromTo("#l2-c", {opacity: 0, y: 60}, {opacity: 1, y: 0, duration: 0.6, ease: "power3.out"}, 3.3);
tl.fromTo("#l2-g", {y: 0}, {y: -744, duration: 2.6, ease: "power1.inOut"}, 4.4);
tl.to("#adegan3 .isi, #adegan3 .kartu, #adegan3 .kertas-lepas", {opacity: 0, duration: 0.3, ease: "power2.in"}, 17.68);
tl.fromTo("#l3-t", {opacity: 0, y: 40}, {opacity: 1, y: 0, duration: 0.5, ease: "power3.out"}, 8.1);
tl.fromTo("#l3-c", {opacity: 0, y: 60}, {opacity: 1, y: 0, duration: 0.6, ease: "power3.out"}, 8.3);
tl.fromTo("#l3-tutup", {yPercent: 0}, {yPercent: 100, duration: 1.8, ease: "steps(9)"}, 8.9);
tl.fromTo("#l3-c2", {opacity: 0, y: 80}, {opacity: 1, y: 0, duration: 0.6, ease: "power3.out"}, 11.5);
tl.fromTo("#a4-t", {opacity: 0, y: 40}, {opacity: 1, y: 0, duration: 0.6, ease: "power3.out"}, 18.2);
window.__timelines["fitur-lempar"] = tl;
</script>
</body>
</html>
