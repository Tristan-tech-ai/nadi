[package]
name = "nadi-mata-agen"
version = "0.1.0"
edition = "2021"
description = "Agen edge Mata: membaca kamera RTSP lewat ffmpeg, menilai zona meja dan antrean, mengirim perubahan ke Nadi"
license = "MIT"
publish = false

[dependencies]
# Versi dari indeks crates.io 4 Nov 2026 (cargo search): ureq 3.5.1 (fitur json, rustls bawaan), serde 1.0.229, serde_json 1.0.154.
ureq = { version = "3.5.1", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
opt-level = "s"
lto = true
strip = true
