<div style="font-family:Arial,sans-serif;color:#1C1B18;max-width:480px">
  <h2>Kode masuk Nadi</h2>
  <p>Ketik kode ini di halaman masuk Nadi:</p>
  <p style="font-size:28px;font-weight:bold;letter-spacing:6px;font-family:monospace">{{ .Token }}</p>
  <p>Atau ketuk tautan ini dari HP atau komputer mana pun: <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email">Masuk ke Nadi</a></p>
  <p style="color:#5B574F;font-size:13px">Kode dan tautan hanya bisa dipakai sekali dan segera kedaluwarsa. Kalau kamu tidak meminta ini, abaikan email ini.</p>
</div>
