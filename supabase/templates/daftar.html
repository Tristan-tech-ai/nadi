<div style="font-family:Arial,sans-serif;color:#1C1B18;max-width:480px">
  <h2>Aktifkan akun Nadi</h2>
  <p>Ketik kode ini di halaman daftar Nadi untuk mengaktifkan akunmu:</p>
  <p style="font-size:28px;font-weight:bold;letter-spacing:6px;font-family:monospace">{{ .Token }}</p>
  <p>Atau ketuk tautan ini: <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email">Aktifkan akun</a></p>
  <p style="color:#5B574F;font-size:13px">Kalau kamu tidak mendaftar ke Nadi, abaikan email ini.</p>
</div>
