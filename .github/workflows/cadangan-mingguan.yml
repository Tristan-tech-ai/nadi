name: Cadangan mingguan
# CADANGAN-01: cadangan database Nadi setiap Senin 02.00 WITA (Minggu 18.00 UTC), terenkripsi AES-256 di runner sebelum diunggah ke
# Storage Bucket privat Hugging Face, lalu diunduh balik dan diuji bisa didekripsi. Rincian dan cara pulih: docs/panduan/cadangan.md.
# Secret dipasang pemilik repo dan tidak pernah dicetak: NADI_DB_URL (Session pooler Supabase), HF_TOKEN (token tulis HF),
# NADI_KUNCI_CADANGAN (kunci enkripsi; simpan salinannya di tempat aman, tanpa kunci ini cadangan tidak bisa dibuka). Variabel: HF_BUCKET.
on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cadangan
  cancel-in-progress: false

jobs:
  cadangan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install huggingface_hub==2.4.0
      - uses: supabase/setup-cli@v3
        with:
          version: 3.1.0
      - name: Uji fungsi cadangan
        run: python -I scripts/cadangan.py selftest
      - name: Buat, enkripsi, unggah, dan uji pulih cadangan
        env:
          NADI_DB_URL: ${{ secrets.NADI_DB_URL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          NADI_KUNCI_CADANGAN: ${{ secrets.NADI_KUNCI_CADANGAN }}
          HF_BUCKET: ${{ vars.HF_BUCKET }}
        run: python -I scripts/cadangan.py
