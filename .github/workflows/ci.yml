name: CI
on:
  push:
  pull_request:

jobs:
  gerbang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # langkah jejak memeriksa seluruh riwayat
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Gerbang kualitas (sama dengan loop/gate.sh lokal)
        run: bash loop/gate.sh
